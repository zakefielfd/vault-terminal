<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULT-TEC ASSISTANT TERMINAL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/tomorrow.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    body { 
      margin:0; padding:0; background:#000; color:#0f0; 
      font-family: 'Share Tech Mono', monospace; overflow:hidden;
    }
    #terminal {
      height:100vh; display:flex; flex-direction:column; padding:20px;
      background: radial-gradient(circle at center, #001100, #000);
      box-shadow: inset 0 0 50px #0f0;
    }
    #header {
      text-align:center; border-bottom:2px solid #0f0; padding-bottom:10px;
      text-shadow: 0 0 10px #0f0;
    }
    #header h1 { margin:0; font-size:2.5em; letter-spacing:4px; }
    #header p { margin:5px; opacity:0.8; }
    #chat { flex:1; overflow-y:auto; padding:10px 0; }
    .message { margin:10px 0; padding:10px; border-left:3px solid #0f0; animation: type 0.05s steps(1); }
    .user { text-align:right; background:rgba(0,50,0,0.3); }
    .assistant { background:rgba(0,30,0,0.5); }
    #input-area { display:flex; padding-top:10px; border-top:2px solid #0f0; }
    #input { flex:1; background:transparent; border:none; color:#0f0; font-size:1.2em; outline:none; }
    #send { background:#0f0; color:#000; border:none; padding:0 20px; cursor:pointer; font-weight:bold; }
    .glitch { animation: glitch 2s infinite; }
    @keyframes glitch {
      0%,100% { text-shadow: 0 0 10px #0f0; }
      50% { text-shadow: 2px 2px #f00, -2px -2px #0ff; }
    }
    ::-webkit-scrollbar { width:8px; }
    ::-webkit-scrollbar-track { background:#000; }
    ::-webkit-scrollbar-thumb { background:#0f0; box-shadow:0 0 10px #0f0; }
  </style>
</head>
<body>
  <div id="terminal">
    <div id="header" class="glitch">
      <h1>VAULT-TEC ASSISTANT</h1>
      <p>PROPERTY OF VAULT-TEC CORPORATION • CLEARANCE LEVEL: OVERSEER</p>
    </div>
    <div id="chat">
      <div class="message assistant">
        <strong>~ Vault-Tec AI online ~</strong><br>
        Bienvenido, residente. ¿En qué puedo asistirle hoy?<br>
        > _
      </div>
    </div>
    <div id="input-area">
      <input type="text" id="input" placeholder="Introduzca comando..." autocomplete="off">
      <button id="send">ENVIAR</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/core.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/languages/bash.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/languages/python.js"></script>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    const messages = [{ role: 'system', content: 'Eres un asistente Vault-Tec útil y sarcástico con estilo retro-futurista.' }];

    function addMessage(content, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = marked.parse(content);
      hljs.highlightAll(div);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const userText = input.value.trim();
      if (!userText) return;
      addMessage(userText, 'user');
      input.value = '';

      messages.push({ role: 'user', content: userText });

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();
      addMessage(data.content, 'assistant');
      messages.push({ role: 'assistant', content: data.content });
    }

    send.onclick = sendMessage;
    input.onkeydown = e => { if (e.key === 'Enter') sendMessage(); };
  </script>
</body>
</html>
