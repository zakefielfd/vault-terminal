<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAULT-TEC ASSISTANT TERMINAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { margin:0; padding:0; background:#000; color:#0f0; font-family: 'Share Tech Mono', monospace; height:100vh; display:flex; flex-direction:column; }
        #terminal { flex:1; padding:20px; background:radial-gradient(circle at center, #001100, #000); box-shadow:inset 0 0 50px #0f0; display:flex; flex-direction:column; }
        #header { text-align:center; border-bottom:2px solid #0f0; padding-bottom:15px; text-shadow:0 0 15px #0f0; animation:glitch 3s infinite; }
        #chat { flex:1; overflow-y:auto; padding:10px 0; }
        .msg { margin:10px 0; padding:15px; border-left:4px solid #0f0; max-width:80%; word-wrap:break-word; }
        .user { align-self:flex-end; background:rgba(0,80,0,0.3); border-left:none; border-right:4px solid #0f0; }
        .assistant { align-self:flex-start; background:rgba(0,40,0,0.6); }
        form { display:flex; padding-top:15px; border-top:2px solid #0f0; }
        input { flex:1; background:transparent; border:none; color:#0f0; font-size:1.3em; outline:none; padding:10px; }
        button { background:#0f0; color:#000; border:none; padding:0 30px; cursor:pointer; font-weight:bold; font-size:1.2em; }
        ::-webkit-scrollbar-thumb { background:#0f0; }
        @keyframes glitch { 0%,100% { text-shadow:0 0 10px #0f0; } 50% { text-shadow:2px 2px #f00, -2px -2px #0ff; } }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="header">
            <h1>VAULT-TEC ASSISTANT</h1>
            <p>PROPERTY OF VAULT-TEC • CLEARANCE: OVERSEER</p>
        </div>
        <div id="chat">
            <div class="msg assistant">
                <strong>~ Sistema Vault-Tec AI inicializado ~</strong><br><br>
                Bienvenido, residente. Este terminal está equipado con inteligencia artificial avanzada.<br>
                Introduzca su consulta para comenzar.
            </div>
            <div class="msg user">{{ user_message }}</div>
            <div class="msg assistant">{{ assistant_message | safe }}</div>
        </div>
        <form action="/chat" method="post">
            <input type="text" name="message" placeholder="Introduzca comando..." autocomplete="off" required autofocus>
            <button type="submit">ENVIAR</button>
        </form>
    </div>
</body>
</html>
